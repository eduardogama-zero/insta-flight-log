<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLIGHT LOG — __HANDLE__</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>__HEATJS__</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070a;--panel:#080c10;--card:#0a1014;--ink:#d9e6e2;--mut:#5f7d78;--amber:#ffb340;--green:#3ff0a8;--cyan:#57d7ff;--line:#15231f;--red:#ff5a52}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Share Tech Mono',ui-monospace,monospace;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100%}
#side{position:relative;width:400px;flex:0 0 400px;background:radial-gradient(120% 60% at 50% -10%,#0c151a 0%,var(--panel) 55%);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#side::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px);mix-blend-mode:overlay;opacity:.5}
#map{flex:1;background:#04070a}
header{padding:13px 18px 9px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d161b,#070b0e)}
.hdr-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.1em;color:var(--mut)}
.reg{color:var(--amber)}.sys{display:inline-flex;align-items:center;gap:6px;color:var(--green)}
.led{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2.4s infinite}
@keyframes blink{0%,92%,100%{opacity:1}94%{opacity:.25}}
h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:21px;letter-spacing:.14em;margin:7px 0 2px;color:#eaf4f1;text-shadow:0 0 12px rgba(87,215,255,.18)}
.sub{color:var(--mut);font-size:9.5px;letter-spacing:.12em}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:11px 14px}
.k{position:relative;background:linear-gradient(180deg,#0b1216,#06090c);border:1px solid var(--line);border-radius:7px;padding:8px 9px 9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),inset 0 0 22px rgba(0,0,0,.5)}
.k span{display:block;font-size:8.5px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-bottom:3px}
.k b{font-family:'Orbitron',sans-serif;font-weight:700;font-size:20px;line-height:1;color:var(--amber);text-shadow:0 0 9px rgba(255,179,64,.45)}
.k.b2 b{color:var(--green);text-shadow:0 0 9px rgba(63,240,168,.4)}.k.b2 span{color:#4c6b64}
.cost{margin:0 14px 6px;padding:9px 12px;border:1px solid #3a2f16;border-radius:8px;background:linear-gradient(180deg,#151005,#0a0806);display:flex;justify-content:space-between;align-items:center}
.cost .cl{font-size:8.5px;letter-spacing:.13em;color:#a98b52;text-transform:uppercase}
.cost .cv{font-family:'Orbitron',sans-serif;font-weight:700;font-size:19px;color:#ffd27a;text-shadow:0 0 10px rgba(255,179,64,.45)}
.cost .ch{font-size:9px;color:var(--mut);text-align:right;margin-top:2px}
.ctrl{padding:9px 18px 11px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ctrl .lab{font-size:9px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
#yrval{color:var(--amber);font-family:'Orbitron',sans-serif;font-weight:700}
.yrrow{display:flex;align-items:center;gap:10px;margin-top:8px}
#play{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:linear-gradient(180deg,#0b1216,#070b0e);color:var(--amber);cursor:pointer;font-size:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
#play:hover{border-color:var(--amber)}
#yr{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:linear-gradient(90deg,#123,#1c3a34);outline:none}
#yr::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);cursor:pointer;border:2px solid #1a1207}
#yr::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.toggles{display:flex;flex-wrap:wrap;gap:13px;margin-top:11px;font-size:9.5px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.toggles label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.toggles input{-webkit-appearance:none;appearance:none;width:28px;height:15px;border-radius:8px;background:#0c1614;border:1px solid var(--line);position:relative;cursor:pointer}
.toggles input:checked{background:rgba(63,240,168,.18);border-color:var(--green)}
.toggles input::after{content:"";position:absolute;top:1px;left:1px;width:11px;height:11px;border-radius:50%;background:#3a4a47;transition:.15s}
.toggles input:checked::after{left:14px;background:var(--green);box-shadow:0 0 7px var(--green)}
.tabs{display:flex;gap:4px;padding:9px 12px 0}
.tab{flex:1;text-align:center;font-size:9.5px;letter-spacing:.08em;padding:7px 3px;cursor:pointer;color:var(--mut);text-transform:uppercase;border:1px solid var(--line);border-bottom:none;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#0b1216,#070b0e)}
.tab.on{color:#0a0d0c;background:linear-gradient(180deg,#ffc766,#f0a838);border-color:#ffcf7a;box-shadow:0 0 12px rgba(255,179,64,.4);font-weight:700}
.srch{padding:8px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#q{width:100%;background:#0a1014;border:1px solid var(--line);border-radius:5px;color:var(--ink);font-family:'Share Tech Mono',monospace;font-size:11px;padding:6px 9px;letter-spacing:.05em}
#q::placeholder{color:#3a5450}#q:focus{outline:none;border-color:var(--green)}
.pane{overflow:auto;flex:1}
.pane::-webkit-scrollbar{width:8px}.pane::-webkit-scrollbar-thumb{background:#16241f;border-radius:4px}
.grp{padding:9px 18px 5px;color:var(--amber);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line)}
.row{padding:7px 18px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #0e1613}
.row:hover{background:#0c1519}.row .nm{font-size:12px;color:var(--ink)}.row .dt{font-size:9.5px;color:var(--mut)}
.row .ct{font-size:12px;color:var(--green);white-space:nowrap;font-family:'Orbitron',sans-serif;font-weight:700}
.trip .rt{font-size:11px;color:var(--cyan);margin-top:2px;letter-spacing:.02em}
.rec{padding:9px 18px;border-bottom:1px solid #0e1613}
.rec .rk{font-size:9px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.rec .rv{font-size:12.5px;color:var(--amber);margin-top:3px;text-shadow:0 0 8px rgba(255,179,64,.25)}
.ybar{display:flex;align-items:center;gap:8px;padding:5px 18px;font-size:10px}.ybar .y{width:34px;color:var(--amber);font-family:'Orbitron',sans-serif;font-size:11px}
.ybar .bar{height:8px;background:linear-gradient(90deg,var(--cyan),var(--green),var(--amber));border-radius:4px}.ybar .v{color:var(--mut);white-space:nowrap}
.foot{padding:9px 18px;font-size:9px;color:var(--mut);border-top:1px solid var(--line);line-height:1.6}.foot b{color:var(--cyan);font-weight:400}
.switch{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:600;display:flex;gap:4px;background:rgba(6,10,12,.9);border:1px solid var(--line);border-radius:8px;padding:4px;backdrop-filter:blur(4px)}
.switch button{background:none;border:1px solid transparent;color:var(--mut);font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.14em;padding:7px 18px;cursor:pointer;text-transform:uppercase;border-radius:5px}
.switch button.on{color:#0a0d0c;background:linear-gradient(180deg,#ffc766,#f0a838);box-shadow:0 0 12px rgba(255,179,64,.5);font-weight:700}
.rose{position:absolute;top:14px;right:14px;z-index:500;opacity:.55;pointer-events:none}
.nd-tag{position:absolute;left:14px;top:16px;z-index:500;font-size:10px;letter-spacing:.18em;color:var(--green);text-shadow:0 0 8px rgba(63,240,168,.4);pointer-events:none}
.legend{position:absolute;right:14px;bottom:16px;background:rgba(6,10,12,.9);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:10px;color:var(--mut);z-index:500;backdrop-filter:blur(4px)}
.legend i{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-right:6px;background:var(--amber);box-shadow:0 0 6px var(--amber)}
.ylegend{position:absolute;left:14px;bottom:16px;background:rgba(6,10,12,.9);border:1px solid var(--line);border-radius:8px;padding:7px 11px;z-index:500;backdrop-filter:blur(4px)}
.ylegend .bar{width:150px;height:8px;border-radius:4px}.ylegend .lb{display:flex;justify-content:space-between;font-size:9px;color:var(--mut);margin-top:4px;letter-spacing:.06em}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:400;background:radial-gradient(120% 100% at 50% 50%,transparent 62%,rgba(0,0,0,.55) 100%)}
.leaflet-popup-content-wrapper{background:#070c0e;color:var(--ink);border:1px solid var(--line);border-radius:6px}
.leaflet-popup-content{font-family:'Share Tech Mono',monospace;font-size:11.5px;line-height:1.5}.leaflet-popup-content b{color:var(--amber)}
.leaflet-popup-tip{background:#070c0e;border:1px solid var(--line)}.leaflet-container a.leaflet-popup-close-button{color:var(--mut)}
@media(max-width:820px){#app{flex-direction:column}#side{width:100%;flex:none;height:50%}}
</style></head><body>
<div id="app">
 <div id="side">
  <header>
    <div class="hdr-top"><span class="reg">&#9992;&#65039; __HANDLE__</span><span class="sys"><i class="led"></i>SYS ONLINE</span></div>
    <h1>FLIGHT LOG</h1>
    <div class="sub">DATA WINDOW __FIRST__ / __LAST__</div>
  </header>
  <div class="hero" id="hero"></div>
  <div class="cost" id="cost"></div>
  <div class="ctrl">
    <div class="lab"><span>YEAR SELECT / linha do tempo</span><span id="yrval"></span></div>
    <div class="yrrow"><button id="play" title="Replay">&#9654;</button>
      <input id="yr" type="range" min="__YMIN__" max="__YMAX__" value="__YMAX__" step="1"></div>
    <div class="toggles" id="toggles">
      <label><input type="checkbox" id="tPts" checked> pontos</label>
      <label><input type="checkbox" id="tLegs" checked> rotas</label>
      <label><input type="checkbox" id="tPlaces" checked> lugares</label>
    </div>
  </div>
  <div class="tabs">
    <div class="tab on" data-t="trips">Viagens</div><div class="tab" data-t="places">Lugares</div>
    <div class="tab" data-t="countries">Países</div><div class="tab" data-t="years">Ano</div><div class="tab" data-t="records">Rec</div>
  </div>
  <div class="srch"><input id="q" type="text" placeholder="&#128269; buscar cidade, país, viagem…"></div>
  <div class="pane" id="pane"></div>
  <div class="foot" id="foot"></div>
 </div>
 <div id="map">
   <div class="switch"><button id="bRoutes" class="on">Rotas</button><button id="bHeat">Calor</button></div>
   <div class="nd-tag">NAV DISPLAY &middot; ND</div>
   <svg class="rose" width="94" height="94" viewBox="0 0 100 100">
     <circle cx="50" cy="50" r="46" fill="none" stroke="#2a4a44"/><circle cx="50" cy="50" r="34" fill="none" stroke="#1c332f"/>
     <g stroke="#3ff0a8"><line x1="50" y1="4" x2="50" y2="12"/><line x1="50" y1="88" x2="50" y2="96"/><line x1="4" y1="50" x2="12" y2="50"/><line x1="88" y1="50" x2="96" y2="50"/></g>
     <polygon points="50,16 45,26 55,26" fill="#ffb340"/><text x="50" y="46" fill="#3ff0a8" font-size="11" font-family="Orbitron" text-anchor="middle">N</text>
   </svg>
   <div class="ylegend" id="ylegend"><div class="bar"></div><div class="lb"><span>__YMIN__</span><span>__YMAX__</span></div></div>
   <div class="legend" id="legend"><i></i>rota de voo &middot; &#9679; m&iacute;dia geolocalizada</div>
   <div class="vignette"></div>
 </div>
</div>
<script>
const D=__DATA__;
const CUR=(D.currency||'R$');
function km(v){ if(v>=1e6) return (v/1e6).toFixed(2).replace('.',',')+'m'; if(v>=1e3) return Math.round(v/1e3)+'k'; return (''+Math.round(v)); }
function color(y){const t=(y-D.ymin)/Math.max(1,D.ymax-D.ymin);return `hsl(${190-150*t},85%,60%)`;}
const map=L.map('map',{worldCopyJump:true,preferCanvas:true,zoomSnap:0.25,zoomDelta:0.5,wheelPxPerZoomLevel:140,wheelDebounceTime:30,attributionControl:false}).setView([-5,-40],3);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
// year color legend gradient
document.querySelector('#ylegend .bar').style.background=`linear-gradient(90deg,${color(D.ymin)},${color((D.ymin+D.ymax)/2)},${color(D.ymax)})`;

function updateHero(Y){const c=D.cum[Y]||D.cum[D.ymax];
 document.getElementById('hero').innerHTML=`
 <div class="k"><span>países</span><b>${c[0]}</b></div>
 <div class="k"><span>cidades</span><b>${c[1]}</b></div>
 <div class="k"><span>waypoints</span><b>${c[2]}</b></div>
 <div class="k b2"><span>voos · legs</span><b>${c[3]}</b></div>
 <div class="k b2"><span>flt time · h</span><b>${c[5].toLocaleString('pt-BR')}</b></div>
 <div class="k b2"><span>dist · km</span><b>${km(c[4])}</b></div>`;
 const cst=c[6];
 document.getElementById('cost').innerHTML=
  `<div class="cl">custo est. em passagens<br>&middot; quase tudo econômica</div>`+
  `<div><div class="cv">${CUR} ${km(cst)}</div><div class="ch">~${CUR} ${Math.round(cst/Math.max(1,c[5]))}/h</div></div>`;}
const s=D.summary;
document.getElementById('foot').innerHTML=
 `BASE <b>${s.home.split(',')[0]}</b> &middot; MAIS DISTANTE <b>${s.farthest.split(',')[0]}</b> (${s.far_km.toLocaleString('pt-BR')} km)<br>`+
 `FLT TIME faixa ${s.hours_low.toLocaleString('pt-BR')}&ndash;${s.hours_high.toLocaleString('pt-BR')}h &middot; EST. &ge;300 km, 800 km/h + 0,5 h/perna &middot; SRC EXIF/GPS`;

const ROUTE='#ffb340';
function gc(a,b,n=48){const R=x=>x*Math.PI/180,G=x=>x*180/Math.PI;const la1=R(a[0]),lo1=R(a[1]),la2=R(b[0]),lo2=R(b[1]);
 const d=2*Math.asin(Math.sqrt(Math.sin((la2-la1)/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2));if(d===0)return[a,b];
 const P=[];for(let i=0;i<=n;i++){const f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
  const x=A*Math.cos(la1)*Math.cos(lo1)+B*Math.cos(la2)*Math.cos(lo2),y=A*Math.cos(la1)*Math.sin(lo1)+B*Math.cos(la2)*Math.sin(lo2),z=A*Math.sin(la1)+B*Math.sin(la2);
  P.push([G(Math.atan2(z,Math.sqrt(x*x+y*y))),G(Math.atan2(y,x))]);}
 for(let i=1;i<P.length;i++){let dl=P[i][1]-P[i-1][1];if(dl>180)P[i][1]-=360;else if(dl<-180)P[i][1]+=360;}return P;}
const legLayer=L.layerGroup(),ptLayer=L.layerGroup(),plLayer=L.layerGroup(),cityLayer=L.layerGroup();
let heat=L.heatLayer([],{radius:18,blur:24,minOpacity:.30,maxZoom:9,gradient:{0.15:'#0b3d91',0.35:'#57d7ff',0.55:'#3ff0a8',0.75:'#ffb340',1:'#ff5a52'}});
let mode='routes',maxY=D.ymax;
function drawRoutes(){legLayer.clearLayers();ptLayer.clearLayers();plLayer.clearLayers();
 for(const l of D.legs) L.polyline(gc(l.a,l.b),{color:ROUTE,weight:1.1,opacity:.32}).addTo(legLayer);
 for(const p of D.points){if(p[2]>maxY)continue;L.circleMarker([p[0],p[1]],{radius:2.3,color:color(p[2]),weight:0,fillOpacity:.65}).bindPopup(`<b>${p[2]||''}</b> ${p[3]||''}<br>${p[4]||''}`).addTo(ptLayer);}
 for(const pl of D.places){if(pl.first&&+pl.first.slice(0,4)>maxY)continue;const r=Math.min(24,4+Math.sqrt(pl.n)*2);
  L.circleMarker([pl.lat,pl.lon],{radius:r,color:ROUTE,weight:1,fillColor:ROUTE,fillOpacity:.09}).bindPopup(`<b>${pl.label}</b><br>${pl.n} mídias · ${pl.first} → ${pl.last}`).addTo(plLayer);}}
function drawHeat(){heat.setLatLngs(D.points.filter(p=>p[2]<=maxY).map(p=>[p[0],p[1],0.7]));}
function drawCities(){cityLayer.clearLayers();for(const pl of D.places){if(pl.first&&+pl.first.slice(0,4)>maxY)continue;
  L.circleMarker([pl.lat,pl.lon],{radius:2.6,color:'#04070a',weight:.8,fillColor:'#eafff8',fillOpacity:.95}).bindPopup(`<b>${pl.label}</b><br>${pl.n} mídias · ${pl.first} → ${pl.last}`).addTo(cityLayer);}}
const T={pts:document.getElementById('tPts'),legs:document.getElementById('tLegs'),places:document.getElementById('tPlaces')};
function applyRouteToggles(){if(mode!=='routes')return;T.pts.checked?map.addLayer(ptLayer):map.removeLayer(ptLayer);T.legs.checked?map.addLayer(legLayer):map.removeLayer(legLayer);T.places.checked?map.addLayer(plLayer):map.removeLayer(plLayer);}
function setMode(m){mode=m;const on=m==='routes';
 document.getElementById('bRoutes').classList.toggle('on',on);document.getElementById('bHeat').classList.toggle('on',!on);
 document.getElementById('toggles').style.visibility=on?'visible':'hidden';document.getElementById('ylegend').style.display=on?'block':'none';
 document.getElementById('legend').innerHTML=on?'<i></i>rota de voo &middot; &#9679; m&iacute;dia geolocalizada':'&#128293; densidade &middot; &#9679; cada cidade visitada';
 if(on){map.removeLayer(heat);map.removeLayer(cityLayer);drawRoutes();applyRouteToggles();}
 else{[legLayer,ptLayer,plLayer].forEach(l=>map.removeLayer(l));drawHeat();drawCities();map.addLayer(heat);map.addLayer(cityLayer);}}
Object.values(T).forEach(c=>c.onchange=applyRouteToggles);
document.getElementById('bRoutes').onclick=()=>setMode('routes');document.getElementById('bHeat').onclick=()=>setMode('heat');

const pane=document.getElementById('pane'),qbox=document.getElementById('q');
function filterPane(){const v=qbox.value.toLowerCase();pane.querySelectorAll('.row,.rec').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(v)?'':'none';});}
function renderTrips(){pane.innerHTML='';for(const t of D.trips){const r=document.createElement('div');r.className='row trip';
  const dur=t.days?`${t.days}d`:'—';const rt=t.route.join(' › ');
  r.innerHTML=`<div><span class="nm">${t.start.slice(0,7)} · ${dur}</span><div class="rt">${rt}</div><span class="dt">${t.countries.join(', ')}</span></div><span class="ct">${km(t.km)}</span>`;
  r.onclick=()=>map.flyToBounds([[t.b[0],t.b[1]],[t.b[2],t.b[3]]],{padding:[40,40],maxZoom:7});pane.appendChild(r);}filterPane();}
function renderPlaces(){pane.innerHTML='';for(const c of D.country_stats){const g=document.createElement('div');g.className='grp';g.textContent=`${c.name} — ${c.n}`;pane.appendChild(g);
  D.places_full.filter(p=>(p.country||'?')===c.name).forEach(p=>{const r=document.createElement('div');r.className='row';
   r.innerHTML=`<span class="nm">${p.city||p.label}<br><span class="dt">${p.first} → ${p.last}</span></span><span class="ct">${p.n}</span>`;r.onclick=()=>map.flyTo([p.lat,p.lon],8);pane.appendChild(r);});}filterPane();}
function renderCountries(){pane.innerHTML='';const g=document.createElement('div');g.className='grp';g.textContent=`${D.country_stats.length} países`;pane.appendChild(g);
 for(const c of D.country_stats){const r=document.createElement('div');r.className='row';r.innerHTML=`<span class="nm">${c.name}<br><span class="dt">${c.first} → ${c.last} · ${c.pl} lugares</span></span><span class="ct">${c.n}</span>`;
  const pl=D.places_full.find(p=>p.country===c.name);if(pl)r.onclick=()=>map.flyTo([pl.lat,pl.lon],5);pane.appendChild(r);}filterPane();}
function renderYears(){pane.innerHTML='';const mx=Math.max(...D.year.map(y=>y.flight_km))||1;const g=document.createElement('div');g.className='grp';g.textContent='km voados por ano (GPS)';pane.appendChild(g);
 for(const y of D.year){const d=document.createElement('div');d.className='ybar';d.innerHTML=`<span class="y">${y.y}</span><span class="bar" style="width:${Math.max(2,y.flight_km/mx*150)}px"></span><span class="v">${km(y.flight_km)} · ${y.flights}voos · ${y.countries}p</span>`;pane.appendChild(d);}filterPane();}
function renderRecords(){pane.innerHTML='';for(const [k2,v] of D.records){const d=document.createElement('div');d.className='rec';d.innerHTML=`<div class="rk">${k2}</div><div class="rv">${v}</div>`;pane.appendChild(d);}filterPane();}
const R={trips:renderTrips,places:renderPlaces,countries:renderCountries,years:renderYears,records:renderRecords};
let curTab='trips';R.trips();
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');curTab=t.dataset.t;R[curTab]();});
qbox.oninput=filterPane;

const yr=document.getElementById('yr'),yv=document.getElementById('yrval');
function setYear(y){y=Math.max(D.ymin,Math.min(D.ymax,y));maxY=y;yr.value=y;yv.textContent=y;updateHero(y);
 if(mode==='routes'){drawRoutes();applyRouteToggles();}else{drawHeat();drawCities();}}
yr.oninput=()=>setYear(+yr.value);
// replay
let playing=false,timer=null;const pb=document.getElementById('play');
function stopPlay(){playing=false;clearInterval(timer);pb.innerHTML='&#9654;';}
function tick(){if(maxY>=D.ymax){stopPlay();return;}setYear(maxY+1);}
pb.onclick=()=>{if(playing){stopPlay();return;}if(maxY>=D.ymax)setYear(D.ymin);playing=true;pb.innerHTML='&#10073;&#10073;';timer=setInterval(tick,850);};

updateHero(D.ymax);setYear(D.ymax);
map.fitBounds(L.latLngBounds(D.points.map(p=>[p[0],p[1]])).pad(0.08));
</script></body></html>
